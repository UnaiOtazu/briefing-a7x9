name: Audio extra (un solo uso)

# Genera un episodio suelto a partir de extras/akantor-plan.txt sin tocar
# guion.txt ni el workflow diario.
on:
  push:
    branches: [main]
    paths:
      - 'extras/akantor-plan.txt'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: briefing
  cancel-in-progress: false

jobs:
  audio:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Generar MP3
        run: |
          python - <<'PY'
          import asyncio, edge_tts
          async def main():
              texto = open("extras/akantor-plan.txt", encoding="utf-8").read()
              for intento in range(3):
                  try:
                      await edge_tts.Communicate(texto, "es-ES-AlvaroNeural").save("docs/episodes/2026-11-01.mp3")
                      return
                  except Exception as e:
                      print("Intento fallido:", e)
                      if intento == 2:
                          raise
                      await asyncio.sleep(30)
          asyncio.run(main())
          PY
      - name: Actualizar feed
        run: |
          python scripts/feed.py
          sed -i 's|<title>Briefing 2026-11-01</title>|<title>Akantor · Plan fundacional</title>|' docs/feed.xml
      - name: Guardar episodio en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "Episodio extra: Akantor plan fundacional" || echo "Sin cambios"
          git pull --rebase origin main
          git push
      - name: Preparar la web
        uses: actions/configure-pages@v5
      - name: Subir la carpeta docs
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
