name: Generar audio del briefing

on:
  push:
    branches: [main]
    paths:
      - 'guion.txt'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: briefing
  cancel-in-progress: false

jobs:
  audio:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Generar MP3
        run: python scripts/tts.py
      - name: Actualizar feed
        run: python scripts/feed.py
      - name: Guardar episodio en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "Episodio $(date +%F)" || echo "Sin cambios"
          git push
      - name: Preparar la web
        uses: actions/configure-pages@v5
      - name: Subir la carpeta docs
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
